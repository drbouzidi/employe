name: Java CI with Maven
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source depuis GitHub
      - name: Vérification du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configuration de l'environnement Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'


      # Étape de Build & Test mise à jour
      - name: Build, Test & Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # On passe directement les secrets à Maven via le paramètre -D
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.token=$SONAR_TOKEN \
            -Dspring.datasource.url="${{ secrets.DB_URL }}" \
            -Dspring.datasource.username="${{ secrets.DB_USERNAME }}" \
            -Dspring.datasource.password="${{ secrets.DB_PASSWORD }}"
      
      




