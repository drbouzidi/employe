name: Java CI with Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source depuis GitHub
      - name: Vérification du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configuration de l'environnement Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compilation, exécution des tests connectés à RDS et analyse SonarQube
      - name: Build, Test & Sonar Analysis
        env:
          # Injection des secrets de votre base de données RDS
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Jeton pour l'analyse de code Sonar
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify sonar:sonar -Dsonar.token=$SONAR_TOKEN



